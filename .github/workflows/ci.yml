name: SolarIQ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r SolarIQ/backend/requirements.txt
        pip install -r SolarIQ/backend/requirements-dev.txt

    - name: Run Pytest suite
      working-directory: SolarIQ/backend
      run: |
        python -m pytest
